<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>LED Matrix</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #0a0a0f;
    display: grid;
    place-items: center;
    font-family: system-ui, sans-serif;
  }
  canvas {
    image-rendering: pixelated;
    background: #0a0a0f;
    box-shadow: 0 0 60px rgba(255, 159, 67, 0.08);
  }
</style>
</head>
<body>
  <canvas id="led" width="640" height="320"></canvas>
<script>
  const COLS = 64;
  const ROWS = 32;
  const PITCH = 10;        // 10px per LED cell
  const DOT   = 9;         // 9px lit dot, leaving 1px gap
  const BG    = "#0a0a0f";
  const ON    = "#ff9f43";

  // 5x5 bitmap font. Each row is 5 chars wide; '#' = lit, '.' = off.
  const FONT = {
    H: [
      "#...#",
      "#...#",
      "#####",
      "#...#",
      "#...#",
    ],
    E: [
      "#####",
      "#....",
      "####.",
      "#....",
      "#####",
    ],
    L: [
      "#....",
      "#....",
      "#....",
      "#....",
      "#####",
    ],
    O: [
      ".###.",
      "#...#",
      "#...#",
      "#...#",
      ".###.",
    ],
    W: [
      "#...#",
      "#...#",
      "#.#.#",
      "#.#.#",
      ".#.#.",
    ],
    R: [
      "####.",
      "#...#",
      "####.",
      "#.#..",
      "#..##",
    ],
    D: [
      "####.",
      "#...#",
      "#...#",
      "#...#",
      "####.",
    ],
  };

  const LETTER_W = 5;
  const LETTER_H = 5;
  const LETTER_GAP = 1;   // gap between glyphs, in LED pixels
  const SPACE_W = 3;      // width of a space, in LED pixels

  const canvas = document.getElementById("led");
  const ctx = canvas.getContext("2d");

  // Build a grid of on/off pixels then render.
  const grid = Array.from({ length: ROWS }, () => new Array(COLS).fill(false));

  function measure(text) {
    let w = 0;
    for (let i = 0; i < text.length; i++) {
      const ch = text[i];
      if (ch === " ") {
        w += SPACE_W;
      } else {
        w += LETTER_W;
      }
      if (i < text.length - 1) w += LETTER_GAP;
    }
    return w;
  }

  function drawText(text, x0, y0) {
    let x = x0;
    for (let i = 0; i < text.length; i++) {
      const ch = text[i];
      if (ch === " ") {
        x += SPACE_W + LETTER_GAP;
        continue;
      }
      const glyph = FONT[ch];
      for (let row = 0; row < LETTER_H; row++) {
        const line = glyph[row];
        for (let col = 0; col < LETTER_W; col++) {
          if (line[col] === "#") {
            const gx = x + col;
            const gy = y0 + row;
            if (gx >= 0 && gx < COLS && gy >= 0 && gy < ROWS) {
              grid[gy][gx] = true;
            }
          }
        }
      }
      x += LETTER_W + LETTER_GAP;
    }
  }

  function render() {
    ctx.fillStyle = BG;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = ON;
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        if (grid[r][c]) {
          ctx.fillRect(c * PITCH, r * PITCH, DOT, DOT);
        }
      }
    }
  }

  const text = "HELLO WORLD";
  const textW = measure(text);
  const x0 = Math.floor((COLS - textW) / 2);
  const y0 = Math.floor((ROWS - LETTER_H) / 2);
  drawText(text, x0, y0);
  render();
</script>
</body>
</html>
